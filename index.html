<!DOCTYPE html>
<html lang="ru">
    <head>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sova Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ЛОГО -->
<div class="logo">
  <img src="./images/logo1.jpeg">
</div>

<!-- КНОПКИ -->
<div class="controls">

<center><button onclick="applyFilters()" id="search" placeholder="Поиск">Поиск</button></center>

<center>
  <select id="filter">
  <option value="all">Все товары</option>
  <option value="shirt">Футболки</option>
  <option value="kostem">Костюмы</option>
  <option value="cap">Кепки</option>
  <option value="suit">Кроссовки</option>
  <option value="slates">Сланцы</option>
</select>
</center>

<center><button onclick="resetFilter()">Сбросить фильтр</button></center>
<center><button onclick="showAll()">Все товары</button></center>
<center><button onclick="openCart()"> Корзина</button></center>
<center><button onclick="openContacts()">Связаться</button></center>
</div>

<!-- ТОВАРЫ -->
<div class="products" id="products"></div>

<div id="contactModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>

    <h3>Связаться</h3>

    <button onclick="goWhatsApp()">Заказ (WhatsApp)</button>
    <button onclick="goTelegram()">Автор (Telegram)</button>
  </div>
</div>
<footer>
  <p>© SOVA, 2026</p>
</footer>
<script src="script.js"></script>
</body>
</html>
