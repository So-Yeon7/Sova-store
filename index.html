<<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sova Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="logo">
  <img src="./images/logo1.jpeg">
</div>

<div class="controls">

<button onclick="applyFilters()">Поиск</button>

<select id="filter">
  <option value="all">Все товары</option>
  <option value="shirt">Футболки</option>
  <option value="kostem">Костюмы</option>
  <option value="cap">Кепки</option>
  <option value="krossowki">Кроссовки</option>
  <option value="slates">Сланцы</option>
</select>

<button onclick="resetFilter()">Сбросить фильтр</button>
<button onclick="showAll()">Все товары</button>
<button onclick="openCart()">Корзина</button>
<button onclick="openContacts()">Связаться</button>

</div>

<div class="products" id="products"></div>

<div id="contactModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <h3>Связаться</h3>
    <button onclick="goWhatsApp()">WhatsApp</button>
    <button onclick="goTelegram()">Telegram</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
